# Generates the GitHub stats cards as SVG files and commits them into this repo.
#
# Why this instead of a self-hosted Vercel instance:
#   - No PAT to create, store, or rotate. Uses the ephemeral GITHUB_TOKEN.
#   - No service to keep alive. The SVGs are committed files, so they render
#     instantly and can never return 503.
#   - Nothing to pay for.
#
# The action is pinned to a commit SHA rather than a tag. Tags are mutable and
# can be repointed at malicious code; a SHA cannot. This is the recommended
# hardening for third-party GitHub Actions.
#   v2.0.2 = e856fc8de9d7729b463c468911e232cfbdc3d55e

name: Generate stats cards

on:
  schedule:
    # 03:00 UTC daily = 11:00 Malaysia time (UTC+8)
    - cron: "0 3 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

# Needed so the commit step can push back to this repo.
permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=BennChen23&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: username=BennChen23&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards if they changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet && echo "No change, nothing to commit." && exit 0
          git commit -m "chore: refresh stats cards"
          git push
